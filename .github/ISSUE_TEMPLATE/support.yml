name: Support request
description: Ask for help using A Playa Named Gus.
title: "[Support]: "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, private server URLs, or personal media screenshots.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: iPhone, iPad, Apple TV, Apple Vision Pro, or Mac.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Describe the connection, playback, download, or account issue.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include troubleshooting steps already attempted.
    validations:
      required: false
