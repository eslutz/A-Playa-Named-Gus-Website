name: Bug report
description: Report a reproducible A Playa Named Gus problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, private server URLs, or personal media screenshots.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: iPhone, iPad, Apple TV, Apple Vision Pro, or Mac.
      placeholder: "iPhone 16 Pro, iOS 26.5"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "TestFlight build or App Store version"
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin server version
      placeholder: "10.10.x"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Connect to server
        2. Open library
        3. Play item
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Include media format details, HTTP/HTTPS notes, or accessibility technology used when relevant.
    validations:
      required: false
